<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Zabbix</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="login-form">
        <input type="text" id="apiUrl" placeholder="URL API Zabbix">
        <input type="text" id="authToken" placeholder="Token Auth">
        <button id="login-btn">Login</button>
    </div>
    <div id="filters" style="display:none;">
        <select id="host-group-select"></select>
        <input type="datetime-local" id="timeFrom">
        <input type="datetime-local" id="timeTill">
        <button id="generate-report">Generar Informe</button>
    </div>
    <div id="dashboard" style="display:none;">
        <header>
            <h1>Informe Zabbix</h1>
            <div id="header-info">
                <p>Host Group: <span id="host-group"></span></p>
                <p>Data: <span id="report-date"></span></p>
            </div>
            <button id="export-pdf">Exportar a PDF</button>
        </header>
        <main>
            <section id="kpis">
                <div class="card">Total Alertes: <span id="total-alerts">0</span></div>
                <div class="card">Corts ICMP: <span id="icmp-cuts">0</span></div>
            </section>
            <section id="tables">
                <h2>TOP 10 CPU</h2>
                <table id="cpu-table"></table>
                <h2>TOP 10 Memòria</h2>
                <table id="memory-table"></table>
                <h2>TOP 10 Discos</h2>
                <table id="disk-table"></table>
                <h2>Alertes</h2>
                <div id="alerts-badges"></div>
                <h2>Conectivitat ICMP</h2>
                <table id="icmp-table"></table>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
